<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="https://lifeoflucalisti.com/">
<meta property="og:url" content="https://lifeoflucalisti.com/">
<title>Luca Listi</title>
<meta name="description" content="Senior Data & AI Engineer · Ironman & Hybrid Athlete · Chicago, IL">
<meta property="og:type" content="website">
<meta property="og:title" content="Luca Listi (@lifeoflucalisti)">
<meta property="og:description" content="Senior Data & AI Engineer · Ironman & Hybrid Athlete · Chicago, IL">
<meta property="og:image" content="https://lifeoflucalisti.com/avatar.jpg">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<link rel="icon" href="avatar.jpg">
<link rel="apple-touch-icon" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <header>
    <img class="avatar" id="avatar" alt="" hidden>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
    <ul class="socials" id="socials"></ul>
  </header>

  <ul class="links" id="links"></ul>

  <section class="next-race" id="next" hidden>
    <h2>Next race</h2>
    <div><div class="n" id="next-name"></div><span class="d" id="next-date"></span></div>
    <div class="clock" id="next-clock" role="img"></div>
  </section>

  <section id="later-wrap" hidden>
    <h2>Later</h2>
    <ul class="races" id="races"></ul>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
